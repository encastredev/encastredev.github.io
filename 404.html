<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · Encastre</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Newsreader:opsz,wght@6..72,400&family=JetBrains+Mono:wght@500&display=swap" />
    <style>
      :root {
        --paper: #f1f3ef;
        --text: #141a16;
        --graphite: #565e58;
        --rule-strong: #b4bbb2;
        --signal: #1d5c45;
        --on-solid: #f8f9f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0e1210;
          --text: #e8ede8;
          --graphite: #a3aba3;
          --rule-strong: #38423a;
          --signal: #4fbe8e;
          --on-solid: #0e1210;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--paper);
        color: var(--text);
        font-family: "Newsreader", Georgia, serif;
      }
      main {
        max-width: 460px;
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--graphite);
      }
      h1 {
        font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.022em;
        font-size: clamp(30px, 7vw, 44px);
        line-height: 1.05;
        margin: 18px 0 14px;
      }
      p {
        font-size: 18px;
        line-height: 1.5;
        color: var(--graphite);
        margin: 0 0 28px;
      }
      a.btn {
        display: inline-block;
        font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 14.5px;
        text-decoration: none;
        padding: 12px 18px;
        background: var(--text);
        color: var(--on-solid);
      }
      a:focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="36" viewBox="2 3 20 18" aria-hidden="true">
        <path d="M2 3h9v4H7.5v4H11v2H7.5v4H11v4H2z" fill="var(--text)" />
        <path d="M22 3h-9v4h3.5v4H13v2h3.5v4H13v4h9z" fill="var(--signal)" />
      </svg>
      <div class="mono" style="margin-top: 22px">Error 404</div>
      <h1>Esta pieza no encastra.</h1>
      <p>La página que buscás no existe o cambió de lugar.</p>
      <a class="btn" href="/">Volver al inicio</a>
    </main>
  </body>
</html>
