<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1210" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stock">
  <title>Stock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="cabecera">
    <button class="volver" id="volver" type="button" aria-label="Volver" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <svg class="logo" id="logo" viewBox="2 3 20 18" aria-hidden="true"><path class="a" d="M2 3h9v4H7.5v4H11v2H7.5v4H11v4H2z"/><path class="b" d="M22 3h-9v4h3.5v4H13v2h3.5v4H13v4h9z"/></svg>
    <h1 id="titulo">Stock</h1>
    <button type="button" id="sync" class="sync" hidden title="Tocá para actualizar"></button>
  </header>

  <main id="vista"></main>

  <aside class="barra">
    <a class="marca solo-pc" href="#/"><svg class="logo" viewBox="2 3 20 18" aria-hidden="true"><path class="a" d="M2 3h9v4H7.5v4H11v2H7.5v4H11v4H2z"/><path class="b" d="M22 3h-9v4h3.5v4H13v2h3.5v4H13v4h9z"/></svg>Stock</a>
    <nav>
      <a href="#/" data-ruta="inicio"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Inicio</span></a>
      <a href="#/salida" data-ruta="salida" class="solo-pc"><svg class="ic" viewBox="0 0 24 24"><path d="M3 13v7h18v-7M12 15V3M7 8l5-5 5 5"/></svg><span>Sacar productos</span></a>
      <a href="#/entrada" data-ruta="entrada" class="solo-pc"><svg class="ic" viewBox="0 0 24 24"><path d="M3 13v7h18v-7M12 3v12M7 10l5 5 5-5"/></svg><span>Cargar lo que llegó</span></a>
      <a href="#/stock" data-ruta="stock"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg><span>Stock</span></a>
      <button type="button" class="escanear solo-cel" id="btn-escanear"><span class="bot"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M7 8v8M10 8v8M13 8v8M16 8v8"/></svg></span><span>Escanear</span></button>
      <a href="#/historial" data-ruta="historial"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg><span>Historial</span></a>
      <a href="#/ajustes" data-ruta="ajustes"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Ajustes</span></a>
    </nav>
  </aside>

  <input type="file" id="archivo-excel" accept=".xls,.xlsx,.ods,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input type="file" id="archivo-copia" accept=".json,application/json" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
