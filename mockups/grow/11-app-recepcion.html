<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>11 · App · Recepción · GROW Stock</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1b'/%3E%3Crect x='20' y='26' width='24' height='12' fill='%23ffe827'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/ui.css">
</head>
<body data-shell="telefono" data-pantalla="11-app-recepcion.html" data-app-titulo="Recepción">
<main id="pagina" style="display:contents">
  <div id="vista-lista">
    <div class="chico tenue" style="margin:2px 2px 8px">Envíos que están viajando. Tocá uno para recibirlo.</div>
    <div class="pila" style="gap:10px" id="envios"></div>
  </div>

  <div id="vista-detalle" hidden>
    <button class="btn btn-chico btn-fantasma" type="button" id="volver" style="justify-self:start;margin-bottom:8px"><i data-i="back"></i>Envíos</button>
    <div class="pila" style="gap:12px">
      <section class="card"><div class="card-cuerpo pila" style="gap:10px">
        <div class="fila entre" style="flex-wrap:nowrap"><div style="min-width:0"><div class="mono fuerte" style="font-size:20px" id="d-envio"></div><div class="chico tenue corta" id="d-ruta"></div></div><span class="badge b-info"><i data-i="truck"></i>En tránsito</span></div>
        <div><div class="fila entre chico"><span>Bultos escaneados</span><b id="d-bultos-txt"></b></div><div class="progreso" style="margin-top:6px"><span id="d-bultos-barra"></span></div></div>
        <button class="btn btn-acento btn-bloque" type="button" id="escanear-bulto" style="min-height:48px"><i data-i="scan"></i>Escanear bulto</button>
      </div></section>

      <section class="card">
        <div class="card-cab"><div class="card-titulo"><i data-i="box"></i>Contar productos</div><button class="btn btn-chico" type="button" id="contar-todo">Todo OK</button></div>
        <div class="card-cuerpo" id="d-items"></div>
      </section>

      <section class="card"><div class="card-cuerpo"><dl class="kv" id="d-resumen"></dl></div></section>
      <div id="d-aviso"></div>
      <button class="btn btn-oscuro btn-grande btn-bloque" type="button" id="confirmar"><i data-i="check"></i>Confirmar recepción</button>
    </div>
  </div>

  <div id="vista-exito" hidden>
    <section class="card"><div class="exito">
      <div class="exito-ic"><i data-i="check"></i></div>
      <h2 id="e-titulo"></h2>
      <p class="tinta-2" id="e-texto"></p>
      <div class="pila" style="gap:8px;width:100%;margin-top:6px" id="e-acciones"></div>
    </div></section>
  </div>
</main>
<script src="assets/datos.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  const { fmt, esc, icono } = G;
  const $ = (id) => document.getElementById(id);
  const e = G.estado();
  let envio = null, conteo = [], bultosLeidos = 0;

  function renderLista() {
    const tr = e.transitos.filter((t) => t.estado === 'transito');
    $('envios').innerHTML = tr.map((t) => {
      const u = t.items.reduce((a, i) => a + i.cant, 0);
      return `<button type="button" class="card lista-item${t.nuevo ? ' nuevo' : ''}" data-envio="${esc(t.envio)}" style="width:100%;text-align:left;cursor:pointer;padding:12px 14px">
        <span class="pin us">${G.depo(t.origen).corto}</span>
        <div style="min-width:0"><div class="mono fuerte">${esc(t.envio)}</div><div class="chico tenue corta">${G.depo(t.origen).nombre} → ${G.depo(t.destino).nombre} · ${fmt.hace(t.fecha)}</div><div class="chico">${u} u. · ${t.bultos} bulto(s) · ${t.items.length} producto(s)</div></div>
        ${icono('chevron')}</button>`;
    }).join('') || `<div class="card vacio-estado">${icono('check')}No hay envíos en tránsito</div>`;
  }

  function abrir(id) {
    envio = e.transitos.find((t) => t.envio === id && t.estado === 'transito');
    if (!envio) return;
    bultosLeidos = 0;
    conteo = envio.items.map((i) => {
      const existente = G.stockItems(i.pid, envio.destino)[0];
      return { pid: i.pid, esperado: i.cant, contado: 0, ubic: existente ? existente.ubic : (envio.destino === 'MIS' ? 'MOST' : 'RECEP') };
    });
    $('vista-lista').hidden = true;
    $('vista-detalle').hidden = false;
    $('d-envio').textContent = envio.envio;
    $('d-ruta').textContent = `${G.depo(envio.origen).nombre} → ${G.depo(envio.destino).nombre} · ${envio.transporte}`;
    renderDetalle();
  }

  function renderDetalle() {
    $('d-bultos-txt').textContent = `${bultosLeidos} de ${envio.bultos}`;
    $('d-bultos-barra').style.width = `${(bultosLeidos / envio.bultos) * 100}%`;
    $('escanear-bulto').disabled = bultosLeidos >= envio.bultos;
    const ubics = G.ubicaciones(envio.destino).filter((u) => u.id !== 'SIN' && u.id !== 'EST?');
    $('d-items').innerHTML = conteo.map((c) => {
      const p = G.producto(c.pid);
      const dif = c.contado - c.esperado;
      const badge = c.contado === 0 ? '<span class="badge b-neutro">Sin contar</span>' : dif === 0 ? `<span class="badge b-ok">${icono('check')}OK</span>` : dif < 0 ? `<span class="badge b-alerta">${icono('alert')}Faltan ${-dif}</span>` : `<span class="badge b-aviso">${icono('alert')}Sobran ${dif}</span>`;
      return `<div class="pila" style="gap:8px;padding:10px 0;border-bottom:1px solid var(--linea)">
        <div class="fila entre" style="flex-wrap:nowrap"><div style="min-width:0"><div class="mono fuerte corta">${esc(p.codigo)}</div><div class="chico tenue corta">${esc(p.descripcion)} · esperado ${c.esperado}</div></div>${badge}</div>
        <div class="fila entre" style="flex-wrap:nowrap">
          <span class="stepper"><button type="button" data-cont="${c.pid}" data-d="-1" aria-label="Restar">−</button><input type="number" min="0" value="${c.contado}" data-contin="${c.pid}" aria-label="Contado"><button type="button" data-cont="${c.pid}" data-d="1" aria-label="Sumar">+</button></span>
          <select class="select input-chico" data-ubic="${c.pid}" aria-label="Ubicación" style="max-width:170px">${ubics.map((u) => `<option value="${esc(u.id)}" ${u.id === c.ubic ? 'selected' : ''}>${esc(u.id === 'MOST' ? 'Mostrador' : u.id)}</option>`).join('')}</select>
        </div>
      </div>`;
    }).join('');
    renderResumen();
  }

  function renderResumen() {
    const esperado = conteo.reduce((a, c) => a + c.esperado, 0);
    const contado = conteo.reduce((a, c) => a + c.contado, 0);
    const difs = conteo.filter((c) => c.contado !== c.esperado).length;
    $('d-resumen').innerHTML = `<dt>Esperado</dt><dd>${esperado} u.</dd><dt>Contado</dt><dd id="r-contado">${contado} u.</dd><dt class="total">Diferencias</dt><dd class="total" id="r-difs">${difs ? `${difs} producto(s)` : 'Ninguna'}</dd>`;
    $('d-aviso').innerHTML = bultosLeidos < envio.bultos ? `<div class="alerta aviso">${icono('alert')}<span>Faltan escanear ${envio.bultos - bultosLeidos} bulto(s).</span></div>`
      : difs ? `<div class="alerta aviso">${icono('alert')}<span>Hay diferencias: se registran y se avisa a ${G.depo(envio.origen).nombre}.</span></div>`
      : `<div class="alerta ok">${icono('check')}<span>Todo coincide con lo despachado.</span></div>`;
    $('confirmar').disabled = contado === 0;
  }

  document.getElementById('pagina').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-envio]');
    if (b) { abrir(b.dataset.envio); return; }
    const c = ev.target.closest('[data-cont]');
    if (c) { const it = conteo.find((x) => x.pid === c.dataset.cont); it.contado = Math.max(0, it.contado + (+c.dataset.d)); renderDetalle(); }
  });
  $('d-items').addEventListener('input', (ev) => {
    const i = ev.target.closest('[data-contin]');
    if (i) { conteo.find((x) => x.pid === i.dataset.contin).contado = Math.max(0, parseInt(i.value, 10) || 0); renderResumen(); }
  });
  $('d-items').addEventListener('change', (ev) => {
    const s = ev.target.closest('[data-ubic]');
    if (s) conteo.find((x) => x.pid === s.dataset.ubic).ubic = s.value;
    if (ev.target.closest('[data-contin]')) renderDetalle();
  });
  $('volver').addEventListener('click', () => { $('vista-detalle').hidden = true; $('vista-lista').hidden = false; renderLista(); });
  $('escanear-bulto').addEventListener('click', () => { bultosLeidos = Math.min(envio.bultos, bultosLeidos + 1); G.toast(`Bulto ${bultosLeidos} de ${envio.bultos} leído`, 'scan'); renderDetalle(); });
  $('contar-todo').addEventListener('click', () => { conteo.forEach((c) => { c.contado = c.esperado; }); bultosLeidos = envio.bultos; renderDetalle(); });

  $('confirmar').addEventListener('click', () => {
    const ritems = conteo.map((c) => `${c.pid}:${c.contado}:${c.ubic}`).join(',');
    const params = { recibido: envio.envio, ritems };
    const total = conteo.reduce((a, c) => a + c.contado, 0);
    $('vista-detalle').hidden = true;
    $('vista-exito').hidden = false;
    $('e-titulo').textContent = `${envio.envio} recibido`;
    $('e-texto').innerHTML = `${total} unidades ubicadas en ${G.depo(envio.destino).nombre}.<br>${conteo.length} producto(s) quedan con etiqueta pendiente.`;
    $('e-acciones').innerHTML = `
      <a class="btn btn-oscuro btn-bloque" id="ir-panel" href="${G.href('01-panel.html', params)}">${icono('dashboard')}Ver el panel actualizado</a>
      <a class="btn btn-acento btn-bloque" href="${G.href('06-etiquetas-producto.html', Object.assign({ ids: conteo.map((c) => c.pid).join(',') }, params))}">${icono('tag')}Imprimir etiquetas</a>
      <a class="btn btn-bloque" href="${G.href('03-ficha-producto.html', Object.assign({ id: conteo[0].pid }, params))}">${icono('file')}Ver la ficha</a>`;
    G.toast('Recepción confirmada');
  });

  renderLista();
  const pre = G.qs('sel') || (G.qs('envio') && !G.qs('recibido') ? G.qs('envio') : '');
  if (pre) abrir(pre);
})();
</script>
</body>
</html>
