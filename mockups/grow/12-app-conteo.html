<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>12 · App · Conteo · GROW Stock</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1b'/%3E%3Crect x='20' y='26' width='24' height='12' fill='%23ffe827'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/ui.css">
</head>
<body data-shell="telefono" data-pantalla="12-app-conteo.html" data-app-titulo="Conteo">
<main id="pagina" style="display:contents">
  <div id="vista-conteo" class="pila" style="gap:12px">
    <section class="card"><div class="card-cuerpo pila" style="gap:10px">
      <label class="campo"><span>Ubicación a contar</span><select class="select" id="ubic" style="height:44px"></select></label>
      <label class="interruptor"><input type="checkbox" id="ciego" checked> <span><b>Conteo ciego</b><span class="chico tenue" style="display:block">No se muestra lo que dice el sistema</span></span></label>
    </div></section>

    <section class="card">
      <div class="card-cab"><div class="card-titulo"><i data-i="box"></i><span id="titulo-lista"></span></div><span class="chico tenue" id="progreso-txt"></span></div>
      <div class="card-cuerpo" id="items"></div>
    </section>

    <section class="card"><div class="card-cuerpo"><dl class="kv" id="resumen"></dl></div></section>
    <button class="btn btn-oscuro btn-grande btn-bloque" type="button" id="confirmar"><i data-i="check"></i>Confirmar conteo</button>
  </div>

  <div id="vista-exito" hidden>
    <section class="card"><div class="exito">
      <div class="exito-ic"><i data-i="check"></i></div>
      <h2 id="e-titulo"></h2>
      <p class="tinta-2" id="e-texto"></p>
      <div class="pila" style="gap:8px;width:100%;margin-top:6px" id="e-acciones"></div>
    </div></section>
  </div>
</main>
<script src="assets/datos.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  const { fmt, esc, icono } = G;
  const $ = (id) => document.getElementById(id);
  const conProductos = G.ubicaciones('MIS').filter((u) => u.id !== 'SIN' && G.productos.some((p) => G.stockItems(p.id, 'MIS').some((s) => s.ubic === u.id)));
  let ubic = conProductos.some((u) => u.id === G.qs('ubic')) ? G.qs('ubic') : 'I6';
  let items = [];

  $('ubic').innerHTML = conProductos.map((u) => `<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join('');

  function cargar() {
    $('ubic').value = ubic;
    items = G.productos.map((p) => ({ p, s: G.stockItems(p.id, 'MIS').find((x) => x.ubic === ubic) })).filter((x) => x.s)
      .map(({ p, s }) => ({ pid: p.id, sistema: s.cant, contado: null }));
    render();
  }

  function render() {
    const ciego = $('ciego').checked;
    $('titulo-lista').textContent = `${items.length} producto(s) en ${ubic}`;
    $('items').innerHTML = items.map((it) => {
      const p = G.producto(it.pid);
      const dif = it.contado == null ? null : it.contado - it.sistema;
      const badge = it.contado == null ? '<span class="badge b-neutro">Pendiente</span>'
        : ciego ? `<span class="badge b-ok">${icono('check')}Contado</span>`
        : dif === 0 ? `<span class="badge b-ok">${icono('check')}Coincide</span>`
        : `<span class="badge ${dif < 0 ? 'b-alerta' : 'b-aviso'}">${icono('alert')}${dif > 0 ? '+' : ''}${dif}</span>`;
      return `<div class="pila" style="gap:8px;padding:10px 0;border-bottom:1px solid var(--linea)">
        <div class="fila entre" style="flex-wrap:nowrap"><div class="fila" style="flex-wrap:nowrap;min-width:0">${G.fotoHTML(p, 'foto-mini')}<div style="min-width:0"><div class="mono fuerte corta">${esc(p.codigo)}</div><div class="chico tenue corta">${esc(p.descripcion)}${ciego ? '' : ` · sistema: <b>${it.sistema}</b>`}</div></div></div>${badge}</div>
        <div class="fila" style="flex-wrap:nowrap">
          <span class="stepper"><button type="button" data-c="${it.pid}" data-d="-1" aria-label="Restar">−</button><input type="number" min="0" value="${it.contado == null ? '' : it.contado}" placeholder="—" data-cin="${it.pid}" aria-label="Contado"><button type="button" data-c="${it.pid}" data-d="1" aria-label="Sumar">+</button></span>
          ${ciego ? '' : `<button type="button" class="btn btn-chico btn-fantasma" data-igual="${it.pid}">= sistema</button>`}
          <label class="btn btn-chico con-archivo" title="Sacar foto">${icono('camera')}${G.fotos(it.pid).length ? 'Otra' : 'Foto'}<input type="file" accept="image/*" capture="environment" data-foto="${it.pid}" aria-label="Sacar foto de ${esc(p.codigo)}"></label>
        </div>
      </div>`;
    }).join('');
    resumen();
  }

  function resumen() {
    const ciego = $('ciego').checked;
    const contados = items.filter((i) => i.contado != null);
    const difs = contados.filter((i) => i.contado !== i.sistema);
    const delta = difs.reduce((a, i) => a + (i.contado - i.sistema), 0);
    const valor = difs.reduce((a, i) => a + (i.contado - i.sistema) * (G.precios(G.producto(i.pid)).arg || 0), 0);
    $('progreso-txt').textContent = `${contados.length}/${items.length}`;
    const conFoto = items.filter((i) => G.fotos(i.pid).length).length;
    $('resumen').innerHTML = `<dt>Contados</dt><dd id="r-contados">${contados.length} de ${items.length}</dd>
      <dt>Con foto</dt><dd id="r-fotos">${conFoto} de ${items.length}</dd>
      ${ciego ? '<dt>Diferencias</dt><dd class="tenue">se ven al confirmar</dd>' : `<dt>Con diferencia</dt><dd id="r-difs">${difs.length}</dd>
      <dt>Unidades de diferencia</dt><dd>${delta > 0 ? '+' : ''}${delta}</dd>
      <dt class="total">Valor al costo ARG</dt><dd class="total" id="r-valor">${valor < 0 ? '−' : valor > 0 ? '+' : ''}${fmt.usd(Math.abs(valor))}</dd>`}`;
    $('confirmar').disabled = contados.length < items.length;
    $('confirmar').innerHTML = contados.length < items.length ? `${icono('clock')}Faltan contar ${items.length - contados.length}` : `${icono('check')}Confirmar conteo`;
  }

  document.getElementById('pagina').addEventListener('click', (e) => {
    const c = e.target.closest('[data-c]');
    if (c) { const it = items.find((x) => x.pid === c.dataset.c); it.contado = Math.max(0, (it.contado == null ? 0 : it.contado) + (+c.dataset.d)); render(); return; }
    const g = e.target.closest('[data-igual]');
    if (g) { const it = items.find((x) => x.pid === g.dataset.igual); it.contado = it.sistema; render(); }
  });
  $('items').addEventListener('input', (e) => {
    const i = e.target.closest('[data-cin]');
    if (i) { const it = items.find((x) => x.pid === i.dataset.cin); it.contado = i.value === '' ? null : Math.max(0, parseInt(i.value, 10) || 0); resumen(); }
  });
  $('items').addEventListener('change', async (e) => {
    if (e.target.closest('[data-cin]')) { render(); return; }
    const campo = e.target.closest('[data-foto]');
    if (!campo || !campo.files || !campo.files[0]) return;
    try {
      G.agregarFoto(campo.dataset.foto, await G.reducirImagen(campo.files[0], 320, 0.72));
      render();
      G.toast('Foto guardada', 'camera');
    } catch (ex) { G.toast(esc(ex.message), 'alert'); }
  });
  $('ubic').addEventListener('change', () => { ubic = $('ubic').value; cargar(); });
  $('ciego').addEventListener('change', render);

  $('confirmar').addEventListener('click', () => {
    const difs = items.filter((i) => i.contado !== i.sistema);
    const delta = difs.reduce((a, i) => a + (i.contado - i.sistema), 0);
    const params = difs.length ? { ajustes: difs.map((i) => `${i.pid}:${ubic}:${i.contado}`).join(',') } : {};
    // la foto viaja a las otras pantallas (una sola, en el #hash de la URL)
    const fotografiados = items.filter((i) => G.fotos(i.pid).length);
    if (fotografiados.length) params.foto = `${fotografiados[0].pid}~${G.fotos(fotografiados[0].pid)[0]}`;
    const idFicha = (fotografiados[0] || difs[0] || {}).pid;
    $('vista-conteo').hidden = true;
    $('vista-exito').hidden = false;
    $('e-titulo').textContent = `Conteo de ${ubic} guardado`;
    $('e-texto').innerHTML = difs.length
      ? `${difs.length} ajuste(s) registrados (${delta > 0 ? '+' : ''}${delta} u.).<br>${difs.map((i) => `<span class="mono">${esc(G.producto(i.pid).codigo)}</span>: ${i.sistema} → <b>${i.contado}</b>`).join('<br>')}`
      : 'Todo coincidía con el sistema. No hizo falta ajustar nada.';
    if (fotografiados.length) $('e-texto').innerHTML += `<br>${fotografiados.length} producto(s) con foto nueva.`;
    $('e-acciones').innerHTML = `
      ${idFicha ? `<a class="btn btn-oscuro btn-bloque" id="ir-ficha" href="${G.href('03-ficha-producto.html', Object.assign({ id: idFicha }, params))}">${icono('file')}${fotografiados.length ? 'Ver la foto en la ficha' : 'Ver el ajuste en la ficha'}</a>` : ''}
      <a class="btn btn-bloque" href="${G.href('01-panel.html', params)}">${icono('dashboard')}Ver en el panel</a>
      <a class="btn btn-bloque btn-fantasma" href="${G.href('05-mapa-deposito.html', Object.assign({ ubic }, params))}">${icono('map')}Ver la ubicación en el mapa</a>`;
    G.toast('Conteo guardado');
  });

  cargar();
})();
</script>
</body>
</html>
