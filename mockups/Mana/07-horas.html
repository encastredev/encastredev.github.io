<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Horas y francos · Maná</title>
<link rel="stylesheet" href="assets/ui.css">
<style>
  .suma-turno {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--verde); font-weight: 600; font-size: 11.5px;
  }
  @media (max-width: 980px) {
    #t-horas td:nth-child(5), #t-horas th:nth-child(5) { display: none; }
  }
  @media (max-width: 820px) {
    #t-horas td:nth-child(2), #t-horas th:nth-child(2) { display: none; }
  }
  @media (max-width: 620px) {
    #t-horas th { width: auto !important; }
    #t-horas td:nth-child(4), #t-horas th:nth-child(4) { display: none; }
  }
</style>
</head>
<body data-shell="escritorio" data-pantalla="07-horas.html">

<main id="pagina">

  <div class="grilla g-kpi" id="kpis"></div>

  <div class="panel">
    <div class="panel-cabecera">
      <h2 id="titulo-periodo">Período</h2>
      <div class="barra-acciones">
        <div class="campo">
          <label for="sel-periodo">Período</label>
          <select id="sel-periodo"></select>
        </div>
        <button class="btn btn-chico" id="btn-exportar">
          <span data-i="bajar" data-tam="15"></span>Exportar para liquidación</button>
      </div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <div class="chips" id="chips-sector"></div>
      <div class="campo" style="flex:1;min-width:180px">
        <input type="search" id="buscar" placeholder="Buscar persona" style="width:100%">
      </div>
      <div class="campo">
        <label for="sel-orden">Ordenar por</label>
        <select id="sel-orden">
          <option value="nocturnas">Horas nocturnas</option>
          <option value="francos">Francos adeudados</option>
          <option value="total">Horas totales</option>
          <option value="nombre">Nombre</option>
        </select>
      </div>
    </div>

    <table class="tabla" id="t-horas">
      <thead>
        <tr>
          <th>Persona</th>
          <th class="der" style="width:110px">Horas del mes</th>
          <th class="der" style="width:140px">De ellas, nocturnas</th>
          <th class="der" style="width:100px">Feriado</th>
          <th class="der" style="width:90px">Extras</th>
          <th class="der" style="width:110px">Francos</th>
        </tr>
      </thead>
      <tbody id="cuerpo"></tbody>
    </table>
    <p style="margin-top:14px;font-size:12.5px;color:var(--tinta-2)" id="pie-tabla"></p>
  </div>

  <div class="etapa-futura">
    <p style="font-size:13px;color:var(--tinta-2);margin:0">
      <strong>Supuesto a confirmar con Jorge.</strong> Tomamos la franja de 22 a 06 como
      nocturna y contamos 8 horas por turno. Falta ver cómo se liquidan hoy los francos
      adeudados y si el turno noche tiene una dotación mínima por convenio.
    </p>
  </div>

  <div id="aviso-simulado"></div>

</main>

<script src="assets/datos.js"></script>
<script src="assets/nav.js"></script>
<script>
var filtroSector = 'todos';
var busqueda = '';
var orden = 'nocturnas';

function iniciar() {
  var sel = document.getElementById('sel-periodo');
  sel.innerHTML = G.D.meta.periodos.map(function (p) {
    return '<option value="' + p + '">' + G.fmt.periodo(p) + '</option>';
  }).join('');
  sel.value = G.periodo();
  sel.addEventListener('change', function () {
    G.estado.periodo = sel.value;
    pintar();
    G.toast('Período: ' + G.fmt.periodo(sel.value));
  });

  document.getElementById('buscar').addEventListener('input', function (e) {
    busqueda = e.target.value; pintarTabla();
  });
  /* la alerta de francos del celular llega con ?orden=francos */
  if (G.param('orden') === 'francos') {
    orden = 'francos';
    document.getElementById('sel-orden').value = 'francos';
  }
  document.getElementById('sel-orden').addEventListener('change', function (e) {
    orden = e.target.value; pintarTabla();
  });
  document.getElementById('btn-exportar').addEventListener('click', function () {
    G.toast('Planilla de ' + G.fmt.periodo(G.estado.periodo) + ' lista para el estudio');
  });

  document.getElementById('aviso-simulado').innerHTML = G.ui.avisoSimulado();
  pintar();
}

/* horas que sumó la recorrida en la pantalla de turnos */
function nocturnasSumadas(empleadoId) {
  var h = 0;
  Object.keys(G.estado.turnosCubiertos).forEach(function (clave) {
    if (clave.split('|')[1] !== 'noche') return;
    G.estado.turnosCubiertos[clave].forEach(function (id) {
      if (id === empleadoId) h += 8;
    });
  });
  return h;
}

function filas() {
  var p = G.estado.periodo;
  return (G.D.horas[p] || []).map(function (f) {
    var e = G.empleado(f.empleadoId);
    var suma = p === G.D.meta.periodoActual ? nocturnasSumadas(f.empleadoId) : 0;
    return {
      e: e, f: f, suma: suma,
      nocturnas: f.nocturnas + suma,
      /* las nocturnas no se suman aparte: son horas trabajadas con recargo,
         ya contadas dentro de las normales */
      total: f.normales + suma + f.extras
    };
  });
}

function pintar() {
  var p = G.estado.periodo;
  var todas = filas();
  var totalNoct = todas.reduce(function (a, x) { return a + x.nocturnas; }, 0);
  var francos = todas.reduce(function (a, x) { return a + x.f.francosAdeudados; }, 0);
  var conFrancos = todas.filter(function (x) { return x.f.francosAdeudados > 0; }).length;
  var cargados = todas.filter(function (x) { return x.total > 190; }).length;

  document.getElementById('titulo-periodo').textContent = G.fmt.periodo(p);

  document.getElementById('kpis').innerHTML = [
    G.ui.kpi({
      rotulo: 'Horas nocturnas', valor: G.fmt.num(totalNoct),
      pie: 'con recargo, dentro de las horas trabajadas'
    }),
    G.ui.kpi({
      rotulo: 'Francos adeudados', valor: francos,
      pie: 'repartidos en ' + conFrancos + ' personas',
      tono: francos > 20 ? 'alerta' : 'ambar'
    }),
    G.ui.kpi({
      rotulo: 'Por encima de 190 h', valor: cargados,
      pie: 'personas con el mes más cargado',
      tono: cargados ? 'ambar' : 'ok'
    }),
    G.ui.kpi({
      rotulo: 'Dotación', valor: G.D.empleados.length,
      pie: 'personas en siete sectores, 24 horas'
    })
  ].join('');

  var chips = ['<button class="chip' + (filtroSector === 'todos' ? ' activo' : '') +
    '" data-sector="todos">Todos</button>'];
  G.D.sectores.forEach(function (s) {
    chips.push('<button class="chip' + (filtroSector === s.id ? ' activo' : '') +
      '" data-sector="' + s.id + '">' + s.nombre + '</button>');
  });
  var cont = document.getElementById('chips-sector');
  cont.innerHTML = chips.join('');
  cont.querySelectorAll('.chip').forEach(function (b) {
    b.addEventListener('click', function () { filtroSector = b.dataset.sector; pintar(); });
  });

  pintarTabla();
  G.pintarIconos(document);
}

function pintarTabla() {
  var lista = filas().filter(function (x) {
    if (filtroSector !== 'todos' && x.e.sector !== filtroSector) return false;
    return G.contiene(x.e.nombre + ' ' + x.e.sectorNombre, busqueda);
  });

  lista.sort(function (a, b) {
    if (orden === 'nombre') return a.e.nombre.localeCompare(b.e.nombre, 'es');
    if (orden === 'francos') return b.f.francosAdeudados - a.f.francosAdeudados || b.nocturnas - a.nocturnas;
    if (orden === 'total') return b.total - a.total;
    return b.nocturnas - a.nocturnas;
  });

  document.getElementById('cuerpo').innerHTML = lista.length
    ? lista.map(function (x) {
        return '<tr>' +
          '<td class="fuerte">' + x.e.nombre +
            '<span class="chica">' + x.e.sectorNombre + ' · turno ' +
            nombreFranja(x.e.franjaHabitual) + ' · ' + x.e.antiguedad + ' años</span></td>' +
          '<td class="der num">' + G.fmt.num(x.f.normales) + '</td>' +
          '<td class="der num fuerte">' + G.fmt.num(x.nocturnas) +
            (x.suma ? '<span class="chica"><span class="suma-turno">+' + x.suma +
              ' de esta semana</span></span>' : '') + '</td>' +
          '<td class="der num">' + (x.f.feriado ? G.fmt.num(x.f.feriado) : '—') + '</td>' +
          '<td class="der num">' + (x.f.extras ? G.fmt.num(x.f.extras) : '—') + '</td>' +
          '<td class="der">' + (x.f.francosAdeudados
            ? G.ui.marca(x.f.francosAdeudados + (x.f.francosAdeudados === 1 ? ' franco' : ' francos'), 'ambar')
            : '<span class="num" style="color:var(--tinta-3)">al día</span>') + '</td>' +
        '</tr>';
      }).join('')
    : G.ui.vacio(6, 'Ninguna persona coincide con el filtro.');

  var noct = lista.reduce(function (a, x) { return a + x.nocturnas; }, 0);
  document.getElementById('pie-tabla').innerHTML =
    '<strong>' + lista.length + '</strong> ' + (lista.length === 1 ? 'persona' : 'personas') +
    ' · <strong>' + G.fmt.num(noct) + '</strong> horas nocturnas en el período. ' +
    'Hoy esto sale de un Excel que se arma a mano todos los meses.';
}

function nombreFranja(id) {
  var f = G.D.franjas.find(function (x) { return x.id === id; });
  return f ? f.nombre.toLowerCase() : id;
}
</script>
</body>
</html>
